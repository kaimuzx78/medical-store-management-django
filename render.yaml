services:
  # Backend Service
  - type: web
    name: medical-store-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn DjangoMedicalStoreManagementSystem.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: CORS_ALLOWED_ORIGINS
        value: https://medical-store-frontend.onrender.com

  # Frontend Service
  - type: web
    name: medical-store-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: REACT_APP_API_URL
        value: https://medical-store-backend.onrender.com 